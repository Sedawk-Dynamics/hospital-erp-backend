services:
  postgres:
    image: postgres:16-alpine
    container_name: hospital-erp-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hospital_erp
      POSTGRES_USER: hospital_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hospital_pass}
    volumes:
      - postgres_data_erp:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_admin -d hospital_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hospital-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: hospital-erp-orthanc
    restart: unless-stopped
    ports:
      - "4242:4242"   # DICOM protocol (DIMSE) for modality C-STORE
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      OHIF_PLUGIN_ENABLED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USERNAME:-hospital}": "${ORTHANC_PASSWORD:-change-me}"}'
      # OHIF served behind the backend PACS proxy.
      ORTHANC__OHIF__ROUTER_BASENAME: "/api/v1/pacs/o/ohif/"
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      # Persistent DICOM blobs + SQLite index (StorageDirectory in orthanc.json).
      - orthanc_data:/var/lib/orthanc/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-erp-api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      DATABASE_URL: postgresql://hospital_admin:${DB_PASSWORD:-hospital_pass}@postgres:5432/hospital_erp
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BCRYPT_SALT_ROUNDS: 12
      PACS_PROVIDER: ${PACS_PROVIDER:-none}
      ORTHANC_URL: ${ORTHANC_URL:-http://orthanc:8042}
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-hospital}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-change-me}
      ORTHANC_OHIF_PATH: ${ORTHANC_OHIF_PATH:-/ohif/viewer}
      PACS_PROXY_ENABLED: ${PACS_PROXY_ENABLED:-true}
      PACS_PROXY_PUBLIC_URL: ${PACS_PROXY_PUBLIC_URL:-http://localhost:4000}
      PACS_COOKIE_SAMESITE: ${PACS_COOKIE_SAMESITE:-lax}
      PACS_COOKIE_SECURE: ${PACS_COOKIE_SECURE:-false}
      PACS_SESSION_TTL_MIN: ${PACS_SESSION_TTL_MIN:-30}
      PACS_DROP_LOCAL: ${PACS_DROP_LOCAL:-false}
      POSTDICOM_VIEWER_URL: ${POSTDICOM_VIEWER_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads

volumes:
  postgres_data_erp:
  redis_data:
  orthanc_data:
  api_uploads:
