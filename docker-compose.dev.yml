services:
  postgres:
    image: postgres:16-alpine
    container_name: hospital-erp-db-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hospital_erp
      POSTGRES_USER: hospital_admin
      POSTGRES_PASSWORD: hospital_pass
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_admin -d hospital_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hospital-erp-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
